<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaccination Management – HopeCare</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <script src="/js/shared/sidebar.js"></script>
  <style>
    .vx-header { margin-bottom:20px; }
    .vx-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
    .vx-card { background:#fff; border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,.08); text-align:center; cursor:pointer; transition:transform .15s; }
    .vx-card:hover { transform:translateY(-2px); }
    .vx-card .num { font-size:28px; font-weight:800; color:#293681; }
    .vx-card .lbl { font-size:12px; color:#64748b; margin-top:4px; }
    .vx-panel { background:#fff; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    .vx-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
    .btn { padding:10px 16px; border-radius:8px; border:none; cursor:pointer; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:8px; }
    .btn-primary { background:#4274D9; color:#fff; }
    .btn-secondary { background:#f1f5f9; color:#475569; }
  </style>
</head>
<body data-nav="vaccination">
<div class="main-wrapper"><script>initAppSidebar();</script>
<div class="main-content">
  <div class="vx-header">
    <h1 style="color:#293681;margin:0 0 6px;"><i class="fa-solid fa-syringe"></i> Vaccination Management</h1>
    <p style="color:#64748b;margin:0;">Record doses, monitor schedules, and manage patient vaccinations.</p>
  </div>
  <div class="vx-cards" id="vxCards"></div>
  <div class="vx-panel">
    <h3 style="color:#293681;margin:0 0 12px;">Quick Actions</h3>
    <div class="vx-actions">
      <a href="/nurse/patients.html?action=add" class="btn btn-primary"><i class="fa-solid fa-user-plus"></i> Register Patient</a>
      <a href="/nurse/patients.html" class="btn btn-secondary"><i class="fa-solid fa-syringe"></i> Record Vaccination Dose</a>
      <a href="/nurse/followup.html?filter=due-today" class="btn btn-secondary"><i class="fa-solid fa-calendar-day"></i> Due Today</a>
      <a href="/nurse/followup.html?filter=incomplete" class="btn btn-secondary"><i class="fa-solid fa-circle-exclamation"></i> Incomplete Treatments</a>
      <a href="/nurse/followup.html" class="btn btn-secondary"><i class="fa-solid fa-clipboard-list"></i> Follow-up Schedules</a>
    </div>
  </div>
</div></div>
<script src="/js/shared/rbac.js"></script>
<script src="/js/shared/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  await checkAuth();
  const res = await fetch('/api/followup/widget/summary');
  const json = await res.json();
  const d = json.data || {};
  document.getElementById('vxCards').innerHTML = `
    <a href="/nurse/followup.html?filter=due-today" class="vx-card" style="text-decoration:none;color:inherit"><div class="num">${d.dueToday||0}</div><div class="lbl">Due Today</div></a>
    <a href="/nurse/followup.html?filter=due-tomorrow" class="vx-card" style="text-decoration:none;color:inherit"><div class="num">${d.dueTomorrow||0}</div><div class="lbl">Upcoming Tomorrow</div></a>
    <a href="/nurse/followup.html?filter=incomplete" class="vx-card" style="text-decoration:none;color:inherit"><div class="num" style="color:#dc2626">${d.incomplete||d.overdue||0}</div><div class="lbl">Incomplete</div></a>
    <a href="/nurse/followup.html?filter=completed" class="vx-card" style="text-decoration:none;color:inherit"><div class="num" style="color:#16a34a">${d.completed||0}</div><div class="lbl">Completed</div></a>`;
});
</script>
</body>
</html>
