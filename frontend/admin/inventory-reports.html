  <style>
    .rpt-page { max-width: 1280px; }

<body class="hc-admin" data-nav="inventory-reports">
<div class="main-wrapper"><script>initAppSidebar();</script>
<div class="main-content rpt-page">
  <div class="rpt-toolbar no-print">
    <div class="rpt-toolbar-title">
      <div class="rpt-toolbar-icon"><i class="fa-solid fa-calendar-day"></i></div>
      <div>
        <h1>Daily Vaccine Inventory Report</h1>
        <p>View and track the daily vaccine usage, inventory levels, and stock movements.</p>
      </div>
    </div>
    <div class="rpt-toolbar-actions">
      <div>
        <label for="rDate">Select Date</label>
        <input type="date" id="rDate">
      </div>
      <button type="button" class="adm-btn adm-btn-primary" id="btnGenerate">
        <i class="fa-solid fa-rotate"></i> Generate Report
      </button>
      <button type="button" class="adm-btn adm-btn-secondary" id="btnPrint">
        <i class="fa-solid fa-print"></i> Print
      </button>
    </div>
  </div>

  <div id="reportBody">
    <p class="rpt-empty">Select a date and generate the daily vaccine inventory report.</p>
  </div>
</div></div>
<script src="/js/shared/rbac.js"></script>
<script src="/js/shared/app.js"></script>
<script>
let reportData = null;

function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function fmtDate(d, withWeekday) {
  if (!d) return '';
  const s = String(d).slice(0, 10);
  const [y, m, day] = s.split('-');
  if (!y || !m || !day) return s;
  const dt = new Date(Number(y), Number(m) - 1, Number(day));
  const opts = { month: 'short', day: '2-digit', year: 'numeric' };
  if (withWeekday) opts.weekday = 'short';
  return dt.toLocaleDateString('en-US', opts);
}

function fmtExp(d) {
  if (!d) return '<span class="rpt-dash">—</span>';
  return esc(String(d).slice(0, 10));
}

function ymd(d) {
  const dt = d instanceof Date ? d : new Date(d);
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const day = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function statusBadge(status) {
  const st = status || 'Pending';
  const map = {
    Recorded: 'badge-recorded',
    Closed: 'badge-recorded',
    Open: 'badge-open',
    Verified: 'badge-recorded',
    Completed: 'badge-recorded',
    Pending: 'badge-pending',
    'Pending PM Count': 'badge-pending',
    'Not Recorded': 'badge-missed',
    'Late Entry': 'badge-late',
    Matched: 'badge-recorded',
    Variance: 'badge-late',
  };
  return `<span class="badge ${map[st] || 'badge-pending'}">${esc(st)}</span>`;
}

function fmtCount(value, status, cls) {
  if (value !== null && value !== undefined && value !== '') {
    return `<span class="rpt-num ${cls || ''}">${esc(value)}</span>`;
  }
  return statusBadge(status || 'Not Recorded');
}

function remarkCell(v) {
  if (v == null || String(v).trim() === '') return '<span class="rpt-dash">—</span>';
  return esc(v);
}

function summaryFrom(sheet, apiSummary) {
  const rows = (sheet && sheet.days || []).flatMap((d) => d.rows || []);
  const used = rows.reduce((s, r) => s + ((r.pm_recorded || r.sheet_status === 'Completed') && r.vaccine_used != null ? Number(r.vaccine_used) : 0), 0);
  const add = rows.reduce((s, r) => s + (r.am_recorded || r.opening_recorded ? Number(r.additional_vaccine) || 0 : 0), 0);
  return {
    total_used: apiSummary && apiSummary.total_used != null ? apiSummary.total_used : used,
    total_additional: apiSummary && apiSummary.total_additional != null ? apiSummary.total_additional : add,
    current_stock: apiSummary && apiSummary.current_stock != null ? apiSummary.current_stock : null,
    low_stock: apiSummary && apiSummary.low_stock != null ? apiSummary.low_stock : 0,
    expired: apiSummary && apiSummary.expired != null ? apiSummary.expired : 0,
  };
}

async function loadStockAlerts() {
  try {
    const r = await fetch('/api/inventory/');
    if (!r.ok) return { low_stock: 0, expired: 0 };
    const j = await r.json();
    if (!j.success) return { low_stock: 0, expired: 0 };
    const lowIds = new Set();
    const expIds = new Set();
    (j.data || []).forEach((lot) => {
      const stockClass = lot.stock_status && lot.stock_status.class;
      if (stockClass && stockClass !== 'stock-normal') lowIds.add(lot.vaccine_id);
      if (lot.expiry_status && lot.expiry_status.class === 'exp-expired') expIds.add(lot.vaccine_id);
    });
    return { low_stock: lowIds.size, expired: expIds.size };
  } catch (e) {
    return { low_stock: 0, expired: 0 };
  }
}

function renderSheet(sheet) {
  if (!sheet || !sheet.days || !sheet.days.length) {
    return '<p class="rpt-empty">No inventory sheet records for this date.</p>';
  }
  const rows = (sheet.days || []).flatMap((d) => (d.rows || []).map((r) => ({ ...r, _date: r.record_date || d.date })));
  const sum = summaryFrom(sheet, reportData && reportData.summary);
  const body = rows.map((r) => {
    const dateLabel = fmtDate(r._date);
    const st = r.sheet_status || r.inventory_status || (r.am_recorded ? (r.pm_recorded ? 'Completed' : 'Pending PM Count') : 'Pending');
    const usedVal = r.pm_recorded && r.vaccine_used != null ? r.vaccine_used : null;
    const usedSt = r.am_recorded && !r.pm_recorded ? 'Pending PM Count' : (st === 'Pending' ? 'Pending' : 'Not Recorded');
    const pmVal = r.inventory_pm != null ? r.inventory_pm : r.remaining_pm_shift;
    const amVal = r.inventory_am != null ? r.inventory_am : r.morning_shift_inventory;
    const diff = r.am_difference != null ? r.am_difference : r.stock_difference;
    const diffLabel = diff == null ? '—' : (Number(diff) > 0 ? ('+' + diff) : String(diff));
    const diffStatus = (diff != null && Number(diff) !== 0 && r.difference_status === 'Matched')
      ? 'Variance'
      : (r.difference_status || (diff == null ? 'Pending' : (Number(diff) === 0 ? 'Matched' : 'Variance')));
    const verified = r.current_verified_stock != null
      ? r.current_verified_stock
      : (r.pm_recorded && pmVal != null ? pmVal : (r.am_recorded && amVal != null ? amVal : null));
    
    // Format Additional Vaccine with PM +X label like Management page
    // FIX: Use total_additional directly (backend now computes correctly)
    let additionalDisplay = '';
    if (r.am_recorded || r.opening_recorded) {
      // Use total_additional from backend (already correct after dayAdditionalParts fix)
      const total = r.total_additional != null ? r.total_additional : (r.additional_vaccine || 0);
      const pmAdd = r.pm_additional || 0;
      const amAdd = r.am_additional || 0;
      
      if (total === 0) {
        additionalDisplay = '<span class="rpt-num rpt-add">0</span>';
      } else if (pmAdd > 0) {
        // Show "total (PM +X)" format - e.g., "10 (PM +10)" when all stock is PM
        additionalDisplay = `<span class="rpt-num rpt-add">${esc(total)}</span><br><span style="font-size:10px;color:#64748b;">(PM +${esc(pmAdd)})</span>`;
      } else if (amAdd > 0 && total === amAdd) {
        // All stock added during AM, show "Included in AM count"
        additionalDisplay = `<span class="rpt-num rpt-add">${esc(total)}</span><br><span style="font-size:10px;color:#64748b;">Included in AM count</span>`;
      } else {
        additionalDisplay = `<span class="rpt-num rpt-add">${esc(total)}</span>`;
      }
    } else {
      additionalDisplay = statusBadge(r.morning_status || 'Not Recorded');
    }
    return `<tr>
    <td class="rpt-date">${esc(dateLabel)}</td>
    <td class="rpt-vax">${esc(r.vaccine_name || r.sheet_label)}</td>
    <td>${fmtCount(amVal, r.morning_status, 'rpt-am')}</td>
    <td>${additionalDisplay}</td>
    <td>${fmtCount(r.pm_recorded ? pmVal : null, r.remaining_status || 'Pending PM Count', 'rpt-remain')}</td>
    <td>${fmtCount(usedVal, usedSt, 'rpt-used')}</td>
    <td>${verified != null ? `<span class="rpt-num rpt-remain">${esc(verified)}</span>` : '<span class="rpt-dash">—</span>'}</td>
    <td class="rpt-exp">${fmtExp(r.expiration_date)}</td>
    <td>${statusBadge(st)}</td>
    <td class="rpt-remarks">${remarkCell(r.remarks || r.verification_reason)}</td>
  </tr>`;
  }).join('');
  const from = sheet.days[0].date;
  const to = sheet.days[sheet.days.length - 1].date;
  const longDate = from === to ? fmtDate(from) : (fmtDate(from) + ' – ' + fmtDate(to));

  return `
    <div class="rpt-print-root">
    <div class="rpt-clinic-head">
      <div class="abc">ABC</div>
      <div class="sub">Animal Bite Center</div>
      <div class="city">Gingoog City</div>
      <div class="sheet-title">VACCINE INVENTORY SHEET</div>
      <div class="sheet-date">${esc(longDate)} · Morning &amp; Afternoon Shift</div>
    </div>
    <div class="rpt-stats no-print">
      <div class="rpt-stat used">
        <div class="rpt-stat-icon"><i class="fa-solid fa-syringe"></i></div>
        <div><div class="val">${esc(sum.total_used)}</div><div class="lbl">Total Vaccines Used</div><div class="unit">vials</div></div>
      </div>
      <div class="rpt-stat add">
        <div class="rpt-stat-icon"><i class="fa-solid fa-cubes"></i></div>
        <div><div class="val">${esc(sum.total_additional)}</div><div class="lbl">Total Additional Stock</div><div class="unit">vials</div></div>
      </div>
      ${sum.current_stock != null ? `<div class="rpt-stat add">
        <div class="rpt-stat-icon"><i class="fa-solid fa-boxes-stacked"></i></div>
        <div><div class="val">${esc(sum.current_stock)}</div><div class="lbl">Current Stock (now)</div><div class="unit">usable vials</div></div>
      </div>` : ''}
      <div class="rpt-stat low">
        <div class="rpt-stat-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <div><div class="val">${esc(sum.low_stock)}</div><div class="lbl">Low Stock Alerts</div><div class="unit">vaccines</div></div>
      </div>
      <div class="rpt-stat exp">
        <div class="rpt-stat-icon"><i class="fa-solid fa-calendar-xmark"></i></div>
        <div><div class="val">${esc(sum.expired)}</div><div class="lbl">Expired Vaccines</div><div class="unit">vaccines</div></div>
      </div>
    </div>
    <div class="rpt-sheet">
      <div class="rpt-sheet-hd">
        <div>
          <h2>Vaccine Inventory Report</h2>
          <div class="clinic">HOPECARE Animal Bite Center — Gingoog City, Misamis Oriental</div>
        </div>
        <div class="rpt-sheet-meta">
          <span class="rpt-pill"><i class="fa-solid fa-calendar-day"></i> Date: ${esc(longDate)}</span>
          <span class="rpt-pill">Morning &amp; Afternoon Shift</span>
        </div>
      </div>
      <div class="rpt-table-wrap">
        <table class="rpt-table">
          <colgroup>
            <col class="col-date">
            <col class="col-vax">
            <col class="col-am">
            <col class="col-add">
            <col class="col-remain">
            <col class="col-used">
            <col class="col-verified">
            <col class="col-exp">
            <col class="col-status">
            <col class="col-remarks">
          </colgroup>
          <thead>
            <tr>
              <th>Date</th>
              <th>Vaccine</th>
              <th>Inventory<br>AM Shift</th>
              <th>Additional<br>Vaccine</th>
              <th>Inventory<br>PM Shift</th>
              <th>Total Used</th>
              <th>Current<br>Verified Stock</th>
              <th>Expiration<br>Date</th>
              <th>Status</th>
              <th>Remarks</th>
            </tr>
          </thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>
    </div>`;
}

async function generateReport() {
  const date = document.getElementById('rDate').value;
  if (!date) return;
  const qs = new URLSearchParams({ type: 'daily', date, from: date, to: date });
  const r = await fetch('/api/inventory-reports/generate?' + qs.toString());
  const j = await r.json();
  if (!j.success) {
    document.getElementById('reportBody').innerHTML = '<p class="rpt-empty">Unable to generate the daily inventory report.</p>';
    return;
  }
  reportData = j.data;
  if (!reportData.summary || reportData.summary.low_stock == null || reportData.summary.expired == null) {
    const alerts = await loadStockAlerts();
    reportData.summary = Object.assign({
      total_used: null,
      total_additional: null,
    }, reportData.summary || {}, alerts);
  }
  document.getElementById('reportBody').innerHTML = renderSheet(j.data.sheet);
}

function printReport() {
  if (!document.querySelector('#reportBody .rpt-sheet')) return;
  window.print();
}

document.addEventListener('DOMContentLoaded', () => {
  checkAuth();
  document.getElementById('rDate').value = ymd(new Date());
  document.getElementById('btnGenerate').addEventListener('click', generateReport);
  document.getElementById('btnPrint').addEventListener('click', printReport);
  generateReport();
});
</script>
</body>
</html>
